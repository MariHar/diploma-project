# Section 1
privacy.section1.title=1. \u0546\u0565\u0580\u0561\u056E\u0578\u0582\u0569\u0575\u0578\u0582\u0576
privacy.section1.p1=\u00AB\u0531\u057E\u0565\u056C\u056B\u0561\u00BB \u056F\u056C\u056B\u0576\u056B\u056F\u0561\u0576 (\u00AB\u0574\u0565\u0576\u0584\u00BB, \u00AB\u0574\u0565\u0566\u00BB \u056F\u0561\u0574 \u00AB\u0574\u0565\u0580\u00BB) \u057A\u0561\u0580\u057F\u0561\u057E\u0578\u0580\u057E\u0578\u0582\u0574 \u0567 \u057A\u0561\u0577\u057F\u057A\u0561\u0576\u0565\u056C \u0541\u0565\u0580 \u0563\u0561\u0572\u057F\u0576\u056B\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0568 \u0587 \u0561\u057A\u0561\u0570\u0578\u057E\u0565\u056C \u0541\u0565\u0580 \u0561\u0576\u0571\u0576\u0561\u056F\u0561\u0576 \u0578\u0582 \u0562\u056A\u0577\u056F\u0561\u056F\u0561\u0576 \u057F\u057E\u0575\u0561\u056C\u0576\u0565\u0580\u056B \u0561\u0576\u057E\u057F\u0561\u0576\u0563\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0568\u0589 \u0531\u0575\u057D \u0533\u0561\u0572\u057F\u0576\u056B\u0578\u0582\u0569\u0575\u0561\u0576 \u0584\u0561\u0572\u0561\u0584\u0561\u056F\u0561\u0576\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0568 \u0562\u0561\u0581\u0561\u057F\u0580\u0578\u0582\u0574 \u0567, \u0569\u0565 \u056B\u0576\u0579\u057A\u0565\u057D \u0565\u0576\u0584 \u0574\u0565\u0576\u0584 \u0570\u0561\u057E\u0561\u0584\u0561\u0563\u0580\u0578\u0582\u0574, \u0585\u0563\u057F\u0561\u0563\u0578\u0580\u056E\u0578\u0582\u0574, \u0583\u0578\u056D\u0561\u0576\u0581\u0578\u0582\u0574 \u0587 \u057A\u0561\u0577\u057F\u057A\u0561\u0576\u0578\u0582\u0574 \u0541\u0565\u0580 \u057F\u057E\u0575\u0561\u056C\u0576\u0565\u0580\u0568, \u0565\u0580\u0562 \u0561\u0575\u0581\u0565\u056C\u0578\u0582\u0574 \u0565\u0584 \u0574\u0565\u0580 \u0570\u0561\u057D\u057F\u0561\u057F\u0578\u0582\u0569\u0575\u0578\u0582\u0576 \u056F\u0561\u0574 \u0585\u0563\u057F\u057E\u0578\u0582\u0574 \u0565\u0584 \u0574\u0565\u0580 \u056E\u0561\u057C\u0561\u0575\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0576\u0565\u0580\u056B\u0581\u0589
privacy.section1.p2=\u0544\u0565\u0576\u0584 \u0563\u0578\u0580\u056E\u0578\u0582\u0574 \u0565\u0576\u0584 \u0570\u0561\u0574\u0561\u0571\u0561\u0575\u0576 HIPAA-\u056B (\u0531\u057C\u0578\u0572\u057B\u0578\u0582\u0569\u0575\u0561\u0576 \u0561\u057A\u0561\u0570\u0578\u057E\u0561\u0563\u0580\u0578\u0582\u0569\u0575\u0561\u0576 \u057F\u057E\u0575\u0561\u056C\u0576\u0565\u0580\u056B \u0583\u0578\u056D\u0561\u0576\u0581\u0565\u056C\u056B\u0578\u0582\u0569\u0575\u0561\u0576 \u0587 \u057A\u0561\u057F\u0561\u057D\u056D\u0561\u0576\u0561\u057F\u057E\u0578\u0582\u0569\u0575\u0561\u0576 \u0561\u056F\u057F), GDPR-\u056B (\u054F\u057E\u0575\u0561\u056C\u0576\u0565\u0580\u056B \u057A\u0561\u0577\u057F\u057A\u0561\u0576\u0578\u0582\u0569\u0575\u0561\u0576 \u0568\u0576\u0564\u0570\u0561\u0576\u0578\u0582\u0580 \u056F\u0561\u0576\u0578\u0576\u0561\u056F\u0561\u0580\u0563) \u0587 \u0563\u0561\u0572\u057F\u0576\u056B\u0578\u0582\u0569\u0575\u0561\u0576 \u057A\u0561\u0570\u057A\u0561\u0576\u0574\u0561\u0576\u0576 \u0561\u057C\u0576\u0579\u057E\u0578\u0572 \u0561\u0575\u056C \u056F\u056B\u0580\u0561\u057C\u0565\u056C\u056B \u0585\u0580\u0565\u0576\u0584\u0576\u0565\u0580\u056B \u0587 \u056F\u0561\u0576\u0578\u0576\u0561\u056F\u0561\u0580\u0563\u0565\u0580\u056B\u0589
privacy.section1.alert=\u0546\u0577\u0578\u0582\u0574. \u0555\u0563\u057F\u057E\u0565\u056C\u0578\u057E \u0574\u0565\u0580 \u056E\u0561\u057C\u0561\u0575\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0576\u0565\u0580\u056B\u0581\u055D \u0534\u0578\u0582\u0584 \u0570\u0561\u0574\u0561\u0571\u0561\u0575\u0576\u0578\u0582\u0574 \u0565\u0584 \u057D\u0578\u0582\u0575\u0576 \u0584\u0561\u0572\u0561\u0584\u0561\u056F\u0561\u0576\u0578\u0582\u0569\u0575\u0561\u0576 \u0574\u0565\u057B \u0576\u056F\u0561\u0580\u0561\u0563\u0580\u057E\u0561\u056E \u057F\u057E\u0575\u0561\u056C\u0576\u0565\u0580\u056B \u0574\u0577\u0561\u056F\u0574\u0561\u0576 \u0563\u0578\u0580\u056E\u0565\u056C\u0561\u056F\u0565\u0580\u057A\u056B\u0576\u0589

