# Section 1
terms.section1.title=1. Acceptance of Terms
terms.section1.p1=By accessing and using the services provided by Avelia Clinic ("we", "our", or "us"), you acknowledge that you have read, understood, and agree to be bound by these Terms of Service. If you do not agree with any part of these terms, you must not use our services.
terms.section1.p2=These terms constitute a legally binding agreement between you and Avelia Clinic. We reserve the right to modify these terms at any time, and such modifications will be effective immediately upon posting.
terms.section1.alert=Important: It is your responsibility to review these terms periodically for changes.

# Section 2
terms.section2.title=2. Medical Services
terms.section2.p1=Avelia Clinic provides comprehensive medical services including, but not limited to:
terms.section2.item1=General medical consultations
terms.section2.item2=Specialist consultations
terms.section2.item3=Diagnostic and laboratory testing
terms.section2.item4=Surgical procedures
terms.section2.item5=Emergency medical services
terms.section2.p2=All medical services are provided by licensed and board-certified healthcare professionals. We maintain the highest standards of medical care in accordance with applicable medical regulations and best practices.

# Section 3
terms.section3.title=3. Appointments
terms.section3.p1=Scheduling: Appointments can be scheduled through our website, mobile app, or by calling our reception desk. We recommend booking appointments at least 24 hours in advance.
terms.section3.p2=Cancellation Policy: You may cancel or reschedule appointments up to 24 hours before the scheduled time without penalty. Cancellations made less than 24 hours in advance or no-shows may be subject to a cancellation fee.
terms.section3.p3=Late Arrivals: Please arrive 15 minutes before your scheduled appointment. Late arrivals may result in shortened consultation time or rescheduling.

# Section 4
terms.section4.title=4. Payments & Billing
terms.section4.p1=Payment is expected at the time of service unless prior arrangements have been made. We accept the following payment methods:
terms.section4.item1=Cash
terms.section4.item2=Credit Cards
terms.section4.item3=Insurance
terms.section4.item4=Payment Plans
terms.section4.p2=Insurance: If you are using health insurance, please provide your insurance information at the time of booking. You are responsible for understanding your coverage and any co-pays or deductibles.
terms.section4.alert=Note: Unpaid balances may be sent to collections and may affect your ability to receive future services.

# Section 5
terms.section5.title=5. Privacy & Confidentiality
terms.section5.p1=We are committed to protecting your privacy and maintaining the confidentiality of your medical information in accordance with HIPAA (Health Insurance Portability and Accountability Act) and other applicable privacy laws.
terms.section5.p2=Your medical information will only be shared with authorized healthcare providers involved in your care, and with your explicit consent for any other purposes.
terms.section5.p3=For more detailed information about how we collect, use, and protect your data, please refer to our
terms.section5.link=Privacy Policy

# Section 6
terms.section6.title=6. Patient Responsibilities
terms.section6.p1=As a patient, you have certain responsibilities to ensure the best possible care:
terms.section6.item1=Provide accurate medical history
terms.section6.item2=Follow treatment plans
terms.section6.item3=Ask questions for clarity
terms.section6.item4=Inform us of condition changes
terms.section6.item5=Treat staff with respect
terms.section6.item6=Comply with clinical policies
terms.section6.p2=Failure to fulfill these responsibilities may affect the quality of care you receive and could result in termination of services.

# Section 7
terms.section7.title=7. Limitation of Liability
terms.section7.p1=While we strive to provide the highest quality medical care, Avelia Clinic and its affiliated healthcare providers shall not be liable for:
terms.section7.item1=Outcomes from treatment plan non-compliance
terms.section7.item2=Unforeseen inherent medical complications
terms.section7.item3=Delays due to extreme emergency situations
terms.section7.item4=External third-party diagnostic service errors
terms.section7.p2=This limitation of liability does not affect any statutory rights that cannot be waived under applicable law.

# Section 8
terms.section8.title=8. Termination
terms.section8.p1=Either party may terminate the physician-patient relationship at any time with appropriate notice:
terms.section8.p2=By the Patient: You may terminate your relationship with any healthcare provider at avelia clinic at any time by providing written notice.
terms.section8.p3=By avelia clinic: We reserve the right to terminate services if:
terms.section8.item1=Unmet payment obligations
terms.section8.item2=Abusive/threatening behavior
terms.section8.item3=Repeated treatment non-compliance
terms.section8.item4=Requests outside our medical scope
terms.section8.p4=In case of termination, we will provide reasonable assistance in transferring your care to another provider.

# Section 9
terms.section9.title=9. Contact Information
terms.section9.p1=If you have any questions or concerns about these Terms of Service, please contact us:
