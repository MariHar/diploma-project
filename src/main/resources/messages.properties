privacy.section2.m_item3=Test results and diagnostic information
privacy.section2.m_item4=Treatment records and clinical notes
privacy.section2.h3=Technical Information
privacy.section2.t_item1=IP address and device information
privacy.section2.t_item2=Browser type, version, and cookies

# Section 3
privacy.section3.title=3. How We Use Your Information
privacy.section3.p1=We use the collected information for the following purposes:
privacy.section3.u1.title=Treatment & Care
privacy.section3.u1.desc=To provide, coordinate, and manage your healthcare services
privacy.section3.u2.title=Payment Processing
privacy.section3.u2.desc=To bill for services and process insurance claims
privacy.section3.u3.title=Healthcare Operations
privacy.section3.u3.desc=To improve quality of care, train staff, and conduct business operations
privacy.section3.u4.title=Communication
privacy.section3.u4.desc=To send appointment reminders, test results, and health information
privacy.section3.u5.title=Legal Compliance
privacy.section3.u5.desc=To comply with legal obligations and protect rights and safety

# Section 4
privacy.section4.title=4. Information Sharing & Disclosure
privacy.section4.p1=We may share your information with the following parties:
privacy.section4.item1=<strong>Healthcare Providers:</strong> Other doctors, specialists, and medical professionals involved in your care
privacy.section4.item2=<strong>Insurance Companies:</strong> For billing and claims processing
privacy.section4.item3=<strong>Business Associates:</strong> Third-party service providers who help us operate (e.g., billing services, IT support)
privacy.section4.alert=Important: We will never sell your personal or medical information to third parties for marketing purposes.

# Section 5
privacy.section5.title=5. Data Security
privacy.section5.p1=We implement comprehensive security measures to protect your information:
privacy.section5.s1.title=Encryption
privacy.section5.s1.desc=All data is encrypted in transit and at rest
privacy.section5.s2.title=Access Controls
privacy.section5.s2.desc=Strict access restrictions and authentication
privacy.section5.s3.title=Regular Audits
privacy.section5.s3.desc=Periodic security assessments and updates
privacy.section5.s4.title=Staff Training
privacy.section5.s4.desc=Regular privacy and security education
privacy.section5.p2=Despite our best efforts, no security system is impenetrable. We will notify you promptly in the event of any data breach affecting your information.

# Section 6
privacy.section6.title=6. Your Privacy Rights
privacy.section6.p1=Under HIPAA and other privacy laws, you have the following rights:
privacy.section6.r1.title=Right to Access
privacy.section6.r1.desc=Request copies of your medical records
privacy.section6.r2.title=Right to Amend
privacy.section6.r2.desc=Request corrections to inaccurate information
privacy.section6.r3.title=Right to Accounting
privacy.section6.r3.desc=Know who has accessed your information
privacy.section6.p2=To exercise any of these rights, please contact our Privacy Officer using the information provided at the end of this policy.

# Section 7
privacy.section7.title=7. Cookies & Tracking Technologies
privacy.section7.p1=We use cookies and similar tracking technologies to enhance your experience on our website:
privacy.section7.item1=<strong>Essential Cookies:</strong> Required for website functionality
privacy.section7.item2=<strong>Performance Cookies:</strong> Help us understand how visitors use our site
privacy.section7.item3=<strong>Functional Cookies:</strong> Remember your preferences
privacy.section7.p2=You can control cookies through your browser settings. However, disabling cookies may affect website functionality.

# Section 8
privacy.section8.title=8. Children's Privacy
privacy.section8.p1=We provide medical services to patients of all ages, including children. When treating minors, we:
privacy.section8.item1=Obtain parental or guardian consent before collecting information
privacy.section8.item2=Share information with parents/guardians as appropriate
privacy.section8.item3=Respect the privacy rights of adolescents as required by law

# Section 9
privacy.section9.title=9. Changes to This Privacy Policy
privacy.section9.p1=We may update this Privacy Policy periodically to reflect changes in our practices or legal requirements. When we make changes:
privacy.section9.item1=We will update the "Last Updated" date at the top of this policy
privacy.section9.item2=We will post the revised policy on our website
privacy.section9.item3=For significant changes, we may notify you by email or prominent notice

