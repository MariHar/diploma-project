privacy.section1.p1=avelia clinic ("we," "us," or "our") is committed to protecting your privacy and ensuring the security of your personal and medical information. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our facility or use our services.
privacy.section1.p2=We comply with the Health Insurance Portability and Accountability Act (HIPAA), the General Data Protection Regulation (GDPR), and all other applicable privacy laws and regulations.
privacy.section1.alert=Note: By using our services, you consent to the data practices described in this policy.

# Section 2
privacy.section2.title=2. Information We Collect
privacy.section2.p1=We collect several types of information to provide and improve our services:
privacy.section2.h1=Personal Information
privacy.section2.p_item1=Full name, date of birth, and contact information
