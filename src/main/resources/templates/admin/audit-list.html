<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Blockchain Audit List</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 font-sans">
<div class="max-w-6xl mx-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-800">Բլոկչեյն Աուդիտ և Վերահսկողություն</h1>
    <p class="text-slate-500 mt-2">Ընտրեք բժշկական քարտը՝ տվյալների ամբողջականությունը ստուգելու համար:</p>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-slate-100 border-b border-slate-200">
      <tr>
        <th class="py-4 px-6 text-slate-600 font-semibold">Քարտի ID</th>
        <th class="py-4 px-6 text-slate-600 font-semibold">Պացիենտ</th>
        <th class="py-4 px-6 text-slate-600 font-semibold">Բժիշկ</th>
        <th class="py-4 px-6 text-slate-600 font-semibold">Ամսաթիվ</th>
        <th class="py-4 px-6 text-slate-600 font-semibold text-right">Գործողություն</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
      <tr th:each="rec : ${records}" class="hover:bg-slate-50 transition">
        <td class="py-4 px-6 text-sm text-slate-500 font-mono" th:text="${rec.id}"></td>
        <td class="py-4 px-6 font-medium text-slate-800" th:text="${userRepo.findById(rec.patientId).get().firstName + ' ' + userRepo.findById(rec.patientId).get().lastName}"></td>
        <td class="py-4 px-6 text-slate-600" th:text="${doctorRepo.findById(rec.doctorId).get().firstName + ' ' + doctorRepo.findById(rec.doctorId).get().lastName}"></td>
        <td class="py-4 px-6 text-slate-500 text-sm" th:text="${#temporals.format(rec.recordDate, 'dd.MM.yyyy HH:mm')}"></td>
        <td class="py-4 px-6 text-right">
          <a th:href="@{/admin/audit/report/{id}(id=${rec.id})}" class="px-4 py-2 bg-indigo-600 text-white rounded shadow-sm hover:bg-indigo-700 font-medium text-sm transition">
            Ստուգել Անվտանգությունը
          </a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
