<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Draft Invoices Approval</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
<div class="max-w-6xl mx-auto">
  <h1 class="text-3xl font-bold mb-8 text-gray-800">Pending Approvals (Draft Invoices)</h1>

  <div class="bg-white p-6 rounded shadow-lg border-t-4 border-blue-500">
    <table class="w-full text-left">
      <thead>
      <tr class="border-b bg-gray-50">
        <th class="py-3 px-4 font-semibold text-gray-600">Invoice ID</th>
        <th class="py-3 px-4 font-semibold text-gray-600">Patient ID</th>
        <th class="py-3 px-4 font-semibold text-gray-600">Total Amount</th>
        <th class="py-3 px-4 font-semibold text-gray-600">Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="inv : ${draftInvoices}" class="border-b hover:bg-gray-50 transition">
        <td class="py-3 px-4 text-sm text-gray-500" th:text="${inv.id}"></td>
        <td class="py-3 px-4 font-medium" th:text="${inv.patientId}"></td>
        <td class="py-3 px-4 font-bold text-blue-600" th:text="${inv.totalAmount} + ' AMD'"></td>
        <td class="py-3 px-4">
          <form th:action="@{/admin/invoices/{id}/approve(id=${inv.id})}" method="post">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
              Approve & Send
            </button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(draftInvoices)}">
        <td colspan="4" class="py-6 text-center text-gray-500 italic">No draft invoices awaiting approval.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
