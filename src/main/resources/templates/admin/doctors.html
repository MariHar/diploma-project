<!DOCTYPE html>
<html lang="hy" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Բժիշկների Կառավարում - Ադմին</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: { cyan: '#06B6D4', blue: '#3B82F6', purple: '#8B5CF6' }
                    },
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body, input, textarea, select, button { transition: all 0.3s ease; }

        /* Hover անիմացիա բժշկի քարտի համար */
        .doctor-card .hover-info {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease-in-out;
        }
        .doctor-card:hover .hover-info {
            max-height: 250px;
            opacity: 1;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

<!-- ՀԵԴԵՐ / ՆԱՎԻԳԱՑԻԱ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-[1400px] mx-auto px-4 md:px-8 h-20 flex items-center justify-between">

        <div class="flex items-center gap-6">
            <a th:href="@{/admin/dashboard}" class="flex items-center gap-2 text-gray-500 hover:text-accent-cyan transition-colors font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Վերադառնալ Գլխավոր Վահանակ
            </a>
            <div class="h-6 w-px bg-gray-200 hidden md:block"></div>
            <h1 class="text-xl font-bold text-gray-800 hidden md:block">Բժիշկների Կառավարում</h1>
        </div>

        <div class="flex items-center gap-4">
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="flex items-center gap-2 border border-red-200 text-red-600 bg-red-50 hover:bg-red-600 hover:text-white px-5 py-2 rounded-xl font-semibold transition-all shadow-sm hover:shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Ելք
                </button>
            </form>
        </div>
    </div>
</header>

<div class="max-w-[1400px] mx-auto p-4 md:p-8 space-y-6">

    <!-- Բջջային վերնագիր -->
    <div class="mb-4 md:hidden">
        <h2 class="text-3xl font-bold text-gray-900">Բժիշկներ</h2>
    </div>

    <!-- Ծանուցումներ -->
    <div th:if="${errorMsg}" class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl mb-6 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="font-semibold" th:text="${errorMsg}"></span>
        </div>
        <button onclick="this.parentElement.style.display='none'" class="text-red-400 hover:text-red-600 transition text-xl">&times;</button>
    </div>

    <div th:if="${successMsg}" class="bg-green-50 border border-green-200 text-green-700 p-4 rounded-xl mb-6 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="font-semibold" th:text="${successMsg}"></span>
        </div>
        <button onclick="this.parentElement.style.display='none'" class="text-green-400 hover:text-green-600 transition text-xl">&times;</button>
    </div>

    <div class="grid lg:grid-cols-4 gap-8 items-start">

        <!-- ՁԱԽ ՄԱՍ: Բժշկի գրանցում -->
        <div class="lg:col-span-1 bg-white p-6 rounded-3xl border border-gray-200 shadow-sm h-fit sticky top-28">
            <h2 class="text-xl font-bold mb-6 text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-accent-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                Գրանցել Նոր Բժիշկ
            </h2>

            <form th:action="@{/admin/doctors/save}" th:object="${newDoctor}" method="post" enctype="multipart/form-data" class="space-y-4">

                <h3 class="text-xs font-bold text-accent-cyan border-b border-gray-100 pb-2 uppercase tracking-widest">Մուտք և Կապ</h3>
                <div>
                    <input type="email" th:field="*{email}" required placeholder="Էլ․ Հասցե" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan mb-3 transition-shadow">
                    <input type="text" th:field="*{phone}" required placeholder="Հեռախոսահամար" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">
                </div>

                <h3 class="text-xs font-bold text-accent-cyan border-b border-gray-100 pb-2 mt-6 uppercase tracking-widest">Անձնական Տվյալներ</h3>
                <div class="space-y-3">
                    <input type="text" th:field="*{firstName}" required placeholder="Անուն" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">
                    <input type="text" th:field="*{lastName}" required placeholder="Ազգանուն" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">
                    <input type="text" th:field="*{patronymic}" placeholder="Հայրանուն (կամընտիր)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">

                    <label class="block text-xs font-semibold text-gray-500 mt-2">Պրոֆիլի Նկար</label>
                    <input type="file" name="photoFile" accept="image/*" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-600 focus:outline-none focus:ring-2 focus:ring-accent-cyan file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 cursor-pointer text-xs">
                </div>

                <h3 class="text-xs font-bold text-accent-cyan border-b border-gray-100 pb-2 mt-6 uppercase tracking-widest">Մասնագիտություն</h3>
                <div class="space-y-3">
                    <select th:field="*{departmentId}" id="departmentSelect" onchange="renderServices()" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan cursor-pointer transition-shadow">
                        <option value="" disabled selected>-- Ընտրել Բաժանմունք --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>

                    <div id="servicesWrapper" class="hidden mt-2">
                        <label class="block text-xs font-semibold text-gray-500 mb-2">Ընտրել Ծառայությունները</label>
                        <div id="servicesContainer" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 max-h-32 overflow-y-auto space-y-1">
                            <label th:each="srv : ${services}" th:data-dept="${srv.departmentId}" class="service-item hidden items-center space-x-2 text-xs text-gray-700 cursor-pointer p-1.5 hover:bg-white rounded-lg transition-colors">
                                <input type="checkbox" name="serviceIds" th:value="${srv.id}" class="rounded border-gray-300 text-accent-cyan focus:ring-accent-cyan">
                                <span th:text="${srv.name}"></span>
                            </label>
                            <p id="noServicesMsg" class="hidden text-xs text-red-500 p-2 font-medium">Այս բաժանմունքում ծառայություններ չկան:</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <input type="text" th:field="*{specialization}" required placeholder="Մասնագիտացում" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">
                        <input type="number" th:field="*{experienceYears}" required placeholder="Փորձ (Տարի)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">
                    </div>

                    <textarea th:field="*{description}" rows="2" placeholder="Կենսագրություն / Նկարագրություն" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan mt-2 resize-none transition-shadow"></textarea>

                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Կրթություն</label>
                        <textarea th:field="*{education}" placeholder="Կրթության պատմություն..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan resize-none transition-shadow"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Լեզուներ</label>
                        <input type="text" th:field="*{languagesSpoken}" placeholder="Տիրապետած լեզուներ..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-shadow">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-accent-cyan to-accent-blue text-white font-bold py-3.5 rounded-xl hover:shadow-lg transition-all active:scale-95 mt-6 flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    Գրանցել Բժշկին
                </button>
            </form>
        </div>

        <!-- ԱՋ ՄԱՍ: Բժիշկների Ցանկ -->
        <div class="lg:col-span-3">

            <!-- Ֆիլտրման վահանակ -->
            <div class="bg-white p-5 rounded-2xl border border-gray-200 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-accent-blue/10 text-accent-blue rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">Բժշկական Անձնակազմ</h2>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <select id="cardDeptFilter" onchange="updateCardFilters()" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 outline-none w-full sm:w-56 focus:ring-2 focus:ring-accent-cyan cursor-pointer transition-shadow">
                        <option value="ALL">Բոլոր Բաժանմունքները</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                    <select id="cardServiceFilter" onchange="applyCardFilter()" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 outline-none w-full sm:w-56 focus:ring-2 focus:ring-accent-cyan cursor-pointer transition-shadow">
                        <option value="ALL">Բոլոր Ծառայությունները</option>
                    </select>
                </div>
            </div>

            <!-- Բժիշկների Քարտերի Ցանց -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-start" id="doctorsGrid">

                <div th:each="doc : ${doctors}" class="doctor-card group bg-white border border-gray-200 rounded-3xl flex flex-col shadow-sm hover:shadow-xl hover:border-accent-cyan/40 transition-all duration-300 relative overflow-hidden"
                     th:data-dept="${doc.departmentId}" th:data-services="${doc.serviceIds}">

                    <!-- Դեկորատիվ գիծ վերևում -->
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent-cyan to-accent-blue opacity-0 group-hover:opacity-100 transition-opacity"></div>

                    <a th:href="@{/admin/doctors/edit/{id}(id=${doc.id})}" class="p-6 flex-grow cursor-pointer block relative z-10 bg-white">
                        <div class="flex items-start gap-4">
                            <!-- Նկար կամ սկզբնատառեր -->
                            <img th:if="${doc.photoUrl != null}" th:src="${doc.photoUrl}" class="w-16 h-16 rounded-2xl object-cover border-2 border-gray-100 group-hover:border-accent-cyan/50 transition-colors shadow-sm">
                            <div th:unless="${doc.photoUrl != null}" class="w-16 h-16 rounded-2xl bg-gradient-to-br from-accent-cyan to-accent-blue flex items-center justify-center text-white font-bold text-xl shadow-sm border-2 border-transparent">
                                <span th:text="${#strings.substring(doc.firstName,0,1) + #strings.substring(doc.lastName,0,1)}"></span>
                            </div>

                            <div class="flex-1">
                                <h3 class="font-bold text-lg text-gray-900 leading-tight group-hover:text-accent-cyan transition-colors">
                                    <span th:text="'Բժ. ' + ${doc.firstName} + ' ' + ${doc.lastName}"></span>
                                </h3>
                                <p class="text-xs text-gray-500 mb-1.5" th:text="${doc.patronymic}"></p>
                                <p class="text-sm font-bold text-accent-cyan" th:text="${doc.specialization}"></p>

                                <div class="flex flex-wrap gap-1.5 mt-3">
                                    <span th:if="${doc.active}" class="bg-green-50 text-green-600 border border-green-200 text-[10px] px-2 py-0.5 rounded-md font-bold tracking-wider shadow-sm">ԱԿՏԻՎ</span>
                                    <span th:unless="${doc.active}" class="bg-red-50 text-red-600 border border-red-200 text-[10px] px-2 py-0.5 rounded-md font-bold tracking-wider shadow-sm">ԱՊԱԱԿՏԻՎ</span>

                                    <span th:if="${loginStatuses[doc.id]}" class="bg-blue-50 text-blue-600 border border-blue-200 text-[10px] px-2 py-0.5 rounded-md font-bold tracking-wider shadow-sm" title="Logged in">✓ ԱՎՏՈՐԻԶԱՑՎԱԾ</span>
                                    <span th:unless="${loginStatuses[doc.id]}" class="bg-yellow-50 text-yellow-600 border border-yellow-200 text-[10px] px-2 py-0.5 rounded-md font-bold tracking-wider shadow-sm" title="Waiting for PIN">⏳ ՍՊԱՍՈՒՄ Է</span>
                                </div>
                            </div>
                        </div>

                        <!-- Բացվող ինֆորմացիա Hover-ի ժամանակ -->
                        <div class="hover-info border-t border-gray-100 pt-4 bg-white">
                            <div class="space-y-2 text-xs text-gray-600 font-medium bg-gray-50 p-3 rounded-xl border border-gray-100">
                                <p class="flex items-center gap-2"><svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg> <span th:text="${doc.email}" class="truncate"></span></p>
                                <p class="flex items-center gap-2"><svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg> <span th:text="${doc.phone}"></span></p>
                                <p class="flex items-center gap-2"><svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg> <span th:text="${doc.experienceYears} + ' Տարվա փորձ'"></span></p>
                            </div>
                            <p class="text-xs text-gray-500 mt-3 italic line-clamp-2" th:text="${doc.description ?: 'Կենսագրություն առկա չէ։'}"></p>
                        </div>
                    </a>

                    <!-- Ստորին Վահանակ (Գործողություններ) -->
                    <div class="bg-gray-50 border-t border-gray-100 p-4 flex justify-between items-center relative z-20">
                        <form th:action="@{/admin/doctors/toggle/{id}(id=${doc.id})}" method="post" class="m-0">
                            <button type="submit" th:text="${doc.active ? 'Անջատել' : 'Միացնել'}"
                                    th:class="${doc.active ? 'text-red-500 hover:text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors' : 'text-green-600 hover:text-green-700 bg-green-50 hover:bg-green-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors'}">
                            </button>
                        </form>

                        <div class="flex gap-2">
                            <a th:href="@{/admin/doctors/schedule/{id}(id=${doc.id})}" class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1">
                                🕒 Գրաֆիկ
                            </a>
                            <a th:href="@{/admin/doctors/edit/{id}(id=${doc.id})}" class="bg-blue-50 border border-blue-200 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                Խմբագրել
                            </a>
                        </div>
                    </div>

                </div>

            </div>

            <div id="noDoctorsMessage" class="hidden bg-white p-12 rounded-3xl border border-gray-200 text-center shadow-sm mt-6">
                <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <p class="text-gray-500 font-medium">Այս ընտրության համար բժիշկներ չեն գտնվել:</p>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const allServices = [
        /*[# th:each="srv : ${services}"]*/
        {
            id: /*[[${srv.id}]]*/ '',
            name: /*[[${srv.name}]]*/ '',
            departmentId: /*[[${srv.departmentId}]]*/ ''
        },
        /*[/]*/
    ];
    /*]]>*/

    // --- 1. ՁԱԽ ԿՈՂՄԻ ՖՈՐՄԱՅԻ ՖԻԼՏՐ ---
    function renderServices() {
        const deptId = document.getElementById('departmentSelect').value;
        const wrapper = document.getElementById('servicesWrapper');
        const items = document.querySelectorAll('.service-item');
        let hasVisible = false;

        if (!deptId) {
            wrapper.classList.add('hidden');
            return;
        }

        items.forEach(item => {
            if (item.getAttribute('data-dept') === deptId) {
                item.classList.remove('hidden');
                item.classList.add('flex');
                hasVisible = true;
            } else {
                item.classList.add('hidden');
                item.classList.remove('flex');
                item.querySelector('input').checked = false;
            }
        });

        document.getElementById('noServicesMsg').style.display = hasVisible ? 'none' : 'block';
        wrapper.classList.remove('hidden');
    }

    // --- 2. ԱՋ ԿՈՂՄԻ ՔԱՐՏԵՐԻ ՖԻԼՏՐՄԱՆ JS ---
    function updateCardFilters() {
        const deptId = document.getElementById('cardDeptFilter').value;
        const serviceFilter = document.getElementById('cardServiceFilter');

        serviceFilter.innerHTML = '<option value="ALL">Բոլոր Ծառայությունները</option>';

        if (deptId !== 'ALL') {
            const filteredServices = allServices.filter(s => s.departmentId === deptId);
            filteredServices.forEach(srv => {
                const opt = document.createElement('option');
                opt.value = srv.id;
                opt.text = srv.name;
                serviceFilter.appendChild(opt);
            });
        }
        applyCardFilter();
    }

    function applyCardFilter() {
        const filterDept = document.getElementById('cardDeptFilter').value;
        const filterSrv = document.getElementById('cardServiceFilter').value;
        const cards = document.querySelectorAll('.doctor-card');
        let visibleCount = 0;

        cards.forEach(card => {
            const rowDept = card.getAttribute('data-dept');
            const rowServices = card.getAttribute('data-services') || "";

            const matchDept = (filterDept === 'ALL' || rowDept === filterDept);
            const matchSrv = (filterSrv === 'ALL' || rowServices.includes(filterSrv));

            if (matchDept && matchSrv) {
                card.style.display = 'flex';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        document.getElementById('noDoctorsMessage').style.display = (visibleCount === 0) ? 'block' : 'none';
    }
</script>

</body>
</html>
