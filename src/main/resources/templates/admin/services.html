<!DOCTYPE html>
<html lang="hy" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ծառայությունների Կառավարում - Ադմին</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { cyan: '#06B6D4', blue: '#3B82F6', purple: '#8B5CF6' }
          },
          fontFamily: { 'sans':['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body, input, textarea, select, button { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

<!-- ՀԵԴԵՐ / ՆԱՎԻԳԱՑԻԱ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between">

    <div class="flex items-center gap-6">
      <!-- Վերադառնալ Գլխավոր Վահանակ -->
      <a th:href="@{/admin/dashboard}" class="flex items-center gap-2 text-gray-500 hover:text-accent-cyan transition-colors font-semibold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Վերադառնալ Գլխավոր Վահանակ
      </a>
      <div class="h-6 w-px bg-gray-200 hidden md:block"></div>
      <h1 class="text-xl font-bold text-gray-800 hidden md:block">Ծառայությունների Կառավարում</h1>
    </div>

    <div class="flex items-center gap-4">
      <!-- Անվտանգ Ելք -->
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="flex items-center gap-2 border border-red-200 text-red-600 bg-red-50 hover:bg-red-600 hover:text-white px-5 py-2 rounded-xl font-semibold transition-all shadow-sm hover:shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Ելք
        </button>
      </form>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">

  <div class="mb-2 md:hidden">
    <h2 class="text-3xl font-bold text-gray-900">Կլինիկայի Ծառայություններ</h2>
  </div>

  <!-- Ֆիլտրման և Ավելացման վահանակ -->
  <div class="bg-white p-5 rounded-2xl border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4 shadow-sm">

    <div class="flex items-center w-full md:w-1/2">
      <label class="text-gray-600 font-semibold mr-4 whitespace-nowrap">Ֆիլտրել ըստ բաժանմունքի:</label>
      <select id="departmentFilter" onchange="filterTable()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-all cursor-pointer font-medium">
        <option value="ALL">🌟 Բոլոր Բաժանմունքները</option>
        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
      </select>
    </div>

    <button onclick="openAddModal()" class="w-full md:w-auto bg-gradient-to-r from-accent-cyan to-accent-blue hover:shadow-lg text-white font-bold py-2.5 px-6 rounded-xl transition-all active:scale-95 shadow-sm whitespace-nowrap flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Ավելացնել Ծառայություն
    </button>
  </div>

  <!-- Ծառայությունների Աղյուսակ -->
  <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Անվանում</th>
          <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Արժեք</th>
          <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Տևողություն</th>
          <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Նկարագրություն</th>
          <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider text-right">Գործողություններ</th>
        </tr>
        </thead>
        <tbody id="servicesTableBody" class="divide-y divide-gray-100">

        <tr th:each="srv : ${services}" class="service-row hover:bg-gray-50 transition-colors" th:data-dept="${srv.departmentId}">
          <td class="p-4 font-bold text-gray-900" th:text="${srv.name}">Կոնսուլտացիա</td>

          <td class="p-4 font-bold text-emerald-600">
            <span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md text-sm border border-emerald-100" th:text="${srv.price} + ' ֏'"></span>
          </td>

          <td class="p-4 text-gray-600 font-medium text-sm" th:text="${srv.durationMinutes} + ' րոպե'">30 րոպե</td>

          <td class="p-4 text-gray-500 text-sm truncate max-w-[200px]" th:text="${srv.description}">Նկարագրություն</td>

          <td class="p-4 text-right">
            <div class="flex justify-end gap-2">
              <a th:href="@{/admin/services/edit/{id}(id=${srv.id})}" class="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">Խմբագրել</a>
              <a th:href="@{/admin/services/delete/{id}(id=${srv.id})}" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors" onclick="return confirm('Վստա՞հ եք, որ ցանկանում եք ջնջել այս ծառայությունը:');">Ջնջել</a>
            </div>
          </td>
        </tr>

        </tbody>
      </table>
    </div>

    <!-- Դատարկ Վիճակ -->
    <div id="noDataMessage" class="hidden p-16 text-center">
      <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      <p class="text-gray-500 font-medium">Այս բաժանմունքում դեռևս ծառայություններ չկան:</p>
    </div>
  </div>

</div>

<!-- ԱՎԵԼԱՑՆԵԼՈՒ ՄՈԴԱԼ (MODAL) -->
<div id="addModal" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center backdrop-blur-sm z-[100] transition-all p-4">
  <div class="bg-white p-8 rounded-3xl w-full max-w-lg border border-gray-200 shadow-2xl relative">

    <button onclick="closeAddModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>

    <div class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4">
      <div class="w-10 h-10 bg-accent-cyan/10 text-accent-cyan rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-900">Ավելացնել Ծառայություն</h2>
    </div>

    <form th:action="@{/admin/services/save}" method="post" class="space-y-5">

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Բաժանմունք</label>
        <select id="modalDeptSelect" name="departmentId" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan cursor-pointer">
          <option value="" disabled selected>-- Ընտրեք Բաժանմունքը --</option>
          <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Ծառայության Անվանում</label>
        <input type="text" name="name" required placeholder="օրինակ՝ Ընդհանուր ստուգում" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">Արժեք (֏)</label>
          <input type="number" step="0.01" name="price" required placeholder="5000" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">Տևողություն (Րոպե)</label>
          <input type="number" name="durationMinutes" required placeholder="30" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Նկարագրություն</label>
        <textarea name="description" required rows="3" placeholder="Մանրամասնեք ծառայությունը..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan resize-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-accent-cyan to-accent-blue text-white font-bold py-3.5 rounded-xl transition-all mt-4 hover:shadow-lg active:scale-95">
        Պահպանել Ծառայությունը
      </button>
    </form>
  </div>
</div>

<script>
  // 1. Ֆիլտրում ենք աղյուսակի տողերը
  function filterTable() {
    let filterId = document.getElementById("departmentFilter").value;
    let rows = document.querySelectorAll(".service-row");
    let visibleCount = 0;

    rows.forEach(row => {
      let rowDept = row.getAttribute("data-dept");
      if (filterId === "ALL" || rowDept === filterId) {
        row.style.display = "";
        visibleCount++;
      } else {
        row.style.display = "none";
      }
    });

    // Եթե ոչ մի ծառայություն չգտնվեց, ցույց ենք տալիս հաղորդագրություն
    document.getElementById("noDataMessage").style.display = visibleCount === 0 ? "block" : "none";
  }

  // 2. Բացում ենք Մոդալը և ավտոմատ նշում բաժանմունքը
  function openAddModal() {
    let filterId = document.getElementById("departmentFilter").value;
    let modalSelect = document.getElementById("modalDeptSelect");

    if(filterId !== "ALL") {
      modalSelect.value = filterId;
    } else {
      modalSelect.value = "";
    }

    document.getElementById("addModal").classList.remove("hidden");
  }

  function closeAddModal() {
    document.getElementById("addModal").classList.add("hidden");
  }

  // Էջը բեռնվելիս ավտոմատ աշխատացնում ենք ֆիլտրը
  document.addEventListener("DOMContentLoaded", filterTable);
</script>

</body>
</html>
