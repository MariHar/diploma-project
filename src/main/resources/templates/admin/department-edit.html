<!DOCTYPE html>
<html lang="hy" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Բաժանմունքի Խմբագրում - Ադմին</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { cyan: '#06B6D4', blue: '#3B82F6', purple: '#8B5CF6' }
          },
          fontFamily: { 'sans':['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body, input, textarea, button { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

<!-- ՀԵԴԵՐ / ՆԱՎԻԳԱՑԻԱ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between">

    <div class="flex items-center gap-6">
      <!-- Վերադառնալ Գլխավոր Վահանակ -->
      <a th:href="@{/admin/dashboard}" class="flex items-center gap-2 text-gray-500 hover:text-accent-cyan transition-colors font-semibold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Գլխավոր Վահանակ
      </a>
      <div class="h-6 w-px bg-gray-200 hidden md:block"></div>
      <!-- Վերադառնալ Բաժանմունքներ -->
      <a th:href="@{/admin/departments}" class="flex items-center gap-2 text-gray-500 hover:text-accent-cyan transition-colors font-semibold hidden md:flex">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Բոլոր Բաժանմունքները
      </a>
    </div>

    <div class="flex items-center gap-4">
      <!-- Անվտանգ Ելք -->
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="flex items-center gap-2 border border-red-200 text-red-600 bg-red-50 hover:bg-red-600 hover:text-white px-5 py-2 rounded-xl font-semibold transition-all shadow-sm hover:shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Ելք
        </button>
      </form>
    </div>
  </div>
</header>

<div class="max-w-7xl mx-auto p-4 md:p-8">

  <!-- Վերնագիր -->
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-900 mb-1">Խմբագրել Բաժանմունքը</h1>
      <p class="text-accent-cyan font-semibold text-lg" th:text="${department.name}"></p>
    </div>
    <a th:href="@{/admin/departments}" class="md:hidden bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-semibold transition-colors flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Հետ
    </a>
  </div>

  <div class="grid lg:grid-cols-3 gap-8">

    <!-- ՁԱԽ ՄԱՍ: Տվյալների թարմացում և Նոր Նկարներ -->
    <div class="lg:col-span-1">
      <form th:action="@{/admin/departments/update/{id}(id=${department.id})}"
            method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm sticky top-28">

        <h2 class="text-xl font-bold mb-6 text-gray-800 border-b border-gray-100 pb-3">Հիմնական Տվյալներ</h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Բաժանմունքի Անվանում</label>
            <input type="text" name="name" th:value="${department.name}" required
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Գտնվելու Վայրը</label>
            <input type="text" name="location" th:value="${department.location}" placeholder="օր․՝ 2-րդ հարկ, սենյակ 204"
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Կոնտակտային Հեռախոս</label>
            <input type="text" name="contactPhone" th:value="${department.contactPhone}" placeholder="+374 ..."
                   class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Նկարագրություն</label>
            <textarea name="description" rows="3" required
                      class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-cyan resize-none"
                      th:text="${department.description}"></textarea>
          </div>

          <!-- Նկարների ընտրություն ԱՀ-ից -->
          <div class="mt-6 border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 hover:border-accent-cyan transition-colors cursor-pointer relative group">
            <input type="file" name="imageFiles" multiple accept="image/*"
                   class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="previewImages(this)">

            <div class="text-gray-400 group-hover:text-accent-cyan transition-colors flex flex-col items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2 transform group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <p class="text-sm font-medium text-gray-600">Ընտրեք նկարներ ԱՀ-ից</p>
              <span class="block text-xs mt-1 text-gray-400">Կարող եք ընտրել մի քանի ֆայլ</span>
            </div>
          </div>

          <!-- Նկարների տեղային (Local) դիտում -->
          <div id="local-preview" class="grid grid-cols-3 gap-2 mt-2"></div>

          <button type="submit" class="w-full mt-6 bg-gradient-to-r from-accent-cyan to-accent-blue text-white font-bold py-3.5 rounded-xl hover:shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            Պահպանել և Վերբեռնել
          </button>
        </div>
      </form>
    </div>

    <!-- ԱՋ ՄԱՍ: Ներկայիս Պատկերասրահի Կառավարում -->
    <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
      <h2 class="text-xl font-bold mb-6 text-gray-800 border-b border-gray-100 pb-3">Առկա Պատկերասրահ</h2>

      <!-- Դատարկ Վիճակ -->
      <div th:if="${#lists.isEmpty(department.images)}" class="text-center py-20 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl">
        <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <p class="text-gray-500 font-medium">Պատկերասրահը դատարկ է:</p>
        <p class="text-sm text-gray-400 mt-1">Վերբեռնեք նոր նկարներ՝ օգտագործելով ձախ կողմի ֆորման:</p>
      </div>

      <!-- Նկարների Ցանց (Grid) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="img, iterStat : ${department.images}"
             class="relative group rounded-xl overflow-hidden border border-gray-200 bg-gray-50 shadow-sm hover:shadow-md transition-shadow flex flex-col">

          <!-- Նկարը -->
          <div class="relative overflow-hidden aspect-video">
            <img th:src="${img.url}"
                 class="w-full h-full object-cover transition-transform duration-500"
                 th:classappend="${!img.active ? 'grayscale opacity-40' : 'group-hover:scale-110'}">

            <!-- Ակտիվ/Ապաակտիվ Badge -->
            <div class="absolute top-2 left-2 z-10">
              <span th:if="${img.active}" class="bg-green-100 text-green-700 border border-green-200 text-[10px] uppercase font-bold px-2.5 py-1 rounded-md shadow-sm">Ակտիվ</span>
              <span th:unless="${img.active}" class="bg-red-100 text-red-700 border border-red-200 text-[10px] uppercase font-bold px-2.5 py-1 rounded-md shadow-sm backdrop-blur-md">Ապաակտիվ</span>
            </div>
          </div>

          <!-- Գործողությունների կոճակներ (Action Buttons) -->
          <div class="p-3 bg-white border-t border-gray-100 flex justify-between items-center gap-2 mt-auto relative z-20">

            <!-- Անջատել/Միացնել Կոճակ -->
            <form th:action="@{/admin/departments/{id}/image/toggle/{idx}(id=${department.id}, idx=${iterStat.index})}" method="post" class="flex-1">
              <button type="submit"
                      th:class="${img.active ? 'w-full text-xs py-2 rounded-lg bg-orange-50 text-orange-600 border border-orange-200 font-semibold hover:bg-orange-100 transition-colors' : 'w-full text-xs py-2 rounded-lg bg-green-50 text-green-600 border border-green-200 font-semibold hover:bg-green-100 transition-colors'}">
                <span th:text="${img.active ? 'Անջատել' : 'Միացնել'}"></span>
              </button>
            </form>

            <!-- Ջնջել Կոճակ -->
            <form th:action="@{/admin/departments/{id}/image/delete/{idx}(id=${department.id}, idx=${iterStat.index})}" method="post">
              <button type="submit" class="p-2 rounded-lg bg-red-50 text-red-500 border border-red-200 hover:bg-red-500 hover:text-white transition-colors"
                      onclick="return confirm('Վստա՞հ եք, որ ցանկանում եք ընդմիշտ ջնջել այս նկարը:')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Preview files locally before uploading to Cloudinary
  function previewImages(input) {
    const preview = document.getElementById('local-preview');
    preview.innerHTML = '';

    if (input.files) {
      Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const div = document.createElement('div');
          div.innerHTML = `<img src="${e.target.result}" class="w-full h-16 object-cover rounded-lg border border-accent-cyan shadow-sm">`;
          preview.appendChild(div);
        }
        reader.readAsDataURL(file);
      });
    }
  }
</script>

</body>
</html>
