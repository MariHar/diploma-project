<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Complete Exam Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 shadow-lg">
    <h1 class="text-xl font-bold text-purple-400">Complete Exam Report</h1>
</nav>

<div class="container mx-auto px-4 py-8 max-w-3xl">
    <a href="/radiologist/dashboard" class="text-gray-400 hover:text-white mb-6 inline-block transition">← Back to Dashboard</a>

    <div th:if="${error}" class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 shadow-sm flex items-center gap-2">
        ❌ <span th:text="${error}"></span>
    </div>

    <!-- 🚀 Upgraded Exam Info Block -->
    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-8 shadow-md">
        <div class="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
            <div>
                <h2 class="text-2xl font-bold text-cyan-400" th:text="${patient?.firstName + ' ' + patient?.lastName}">Patient Name</h2>
                <p class="text-gray-500 text-sm mt-1">Patient ID: <span th:text="${patient?.id}"></span></p>
            </div>
            <div class="text-right">
                <span class="text-gray-400 text-sm block">Ordered By:</span>
                <span class="text-indigo-400 font-bold" th:text="${doctor != null ? 'Dr. ' + doctor.firstName + ' ' + doctor.lastName : 'Unknown Doctor'}">Doctor Name</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6 text-sm">
            <div class="bg-gray-900/50 p-3 rounded-lg border border-gray-700">
                <strong class="text-gray-500 uppercase text-xs block mb-1">Exam Type:</strong>
                <span class="font-bold text-purple-300 text-lg" th:text="${exam.examType}"></span>
            </div>
            <div class="bg-gray-900/50 p-3 rounded-lg border border-gray-700">
                <strong class="text-gray-500 uppercase text-xs block mb-1">Area:</strong>
                <span class="font-bold text-white text-lg" th:text="${exam.areaToExamine}"></span>
            </div>
            <div class="col-span-2 bg-gray-900/50 p-4 rounded-lg border border-gray-700">
                <strong class="text-gray-500 uppercase text-xs block mb-2">Doctor's Clinical Reason:</strong>
                <p class="text-gray-300 italic" th:text="${exam.clinicalReason}"></p>
            </div>
        </div>
    </div>

    <!-- Completion Form -->
    <form th:action="@{/radiologist/exam/{id}/complete(id=${exam.id})}" method="post" enctype="multipart/form-data"
          class="bg-gray-800 rounded-xl border border-purple-500/50 p-8 shadow-2xl">

        <h3 class="text-lg font-bold text-white mb-6 border-b border-gray-700 pb-2">Radiologist Report</h3>

        <div class="mb-6">
            <label for="findings" class="block text-sm font-bold text-gray-300 mb-2">Conclusion / Findings <span class="text-red-400">*</span></label>
            <textarea id="findings" name="findings" rows="8" required placeholder="Enter your detailed clinical findings here..."
                      class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors"></textarea>
        </div>

        <div class="mb-8">
            <label for="reportFile" class="block text-sm font-bold text-gray-300 mb-2">Upload Image or PDF Report (Cloudinary) <span class="text-red-400">*</span></label>
            <div class="p-4 border-2 border-dashed border-gray-600 rounded-xl bg-gray-900/50 text-center hover:border-purple-500 transition-colors">
                <input type="file" id="reportFile" name="reportFile" required accept="image/*,.pdf"
                       class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-600/20 file:text-purple-300 hover:file:bg-purple-600/40 file:transition cursor-pointer">
                <p class="text-xs text-gray-500 mt-2">Accepted formats: JPG, PNG, PDF</p>
            </div>
        </div>

        <div class="flex justify-between items-center pt-6 border-t border-gray-700">
            <a href="/radiologist/dashboard" class="text-gray-400 hover:text-white px-4 py-2 transition">Cancel</a>
            <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-8 rounded-xl transition shadow-[0_0_15px_rgba(147,51,234,0.3)] hover:shadow-[0_0_25px_rgba(147,51,234,0.5)] active:scale-95">
                Upload & Submit Final Report
            </button>
        </div>
    </form>
</div>
</body>
</html>
