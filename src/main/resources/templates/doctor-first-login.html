<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

<div class="bg-gray-800 p-8 rounded-xl border border-gray-700 w-full max-w-md shadow-2xl">

    <div class="text-center mb-8">
        <span class="text-5xl">🔐</span>
        <h2 class="text-2xl font-bold text-white mt-4">Welcome, Doctor!</h2>
        <p class="text-gray-400 text-sm mt-2">For security reasons, you must change your temporary password before accessing the system.</p>
    </div>

    <form th:action="@{/doctor/first-login-setup/save}" method="post">
        <div class="mb-6">
            <label class="block text-gray-300 text-sm font-bold mb-2">Create New Password</label>
            <input type="password" name="newPassword" required minlength="6"
                   class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400"
                   placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-cyan-500 text-gray-900 font-bold rounded-lg px-4 py-3 hover:bg-cyan-400 transition-colors">
            Save Password & Continue
        </button>
    </form>

</div>

</body>
</html>
