<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Radiologist Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold text-purple-400">☢️ Radiologist Dashboard</h1>
    <a href="/logout" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded transition shadow">Logout</a>
</nav>

<div class="container mx-auto px-4 py-8">
    <div th:if="${success}" class="mb-6 p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-green-400 shadow-sm flex items-center gap-2">
        ✅ <span th:text="${success}"></span>
    </div>

    <h2 class="text-2xl font-bold text-white mb-6">Pending Exam Orders</h2>

    <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-700/50">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-300 uppercase tracking-wider">Date</th>
                    <!-- 🚀 NEW COLUMN -->
                    <th class="px-6 py-4 text-left text-xs font-bold text-cyan-400 uppercase tracking-wider">Patient</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-purple-400 uppercase tracking-wider">Exam</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-300 uppercase tracking-wider">Reason</th>
                    <!-- 🚀 NEW COLUMN -->
                    <th class="px-6 py-4 text-left text-xs font-bold text-indigo-400 uppercase tracking-wider">Ordered By</th>
                    <th class="px-6 py-4 text-right text-xs font-bold text-gray-300 uppercase tracking-wider">Action</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                <!-- We loop over the enriched DTO -->
                <tr th:each="dto : ${pendingExams}" class="hover:bg-gray-700/40 transition">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400" th:text="${#temporals.format(dto.exam.orderDate, 'dd MMM, HH:mm')}"></td>

                    <!-- 🚀 DISPLAY PATIENT -->
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-white" th:text="${dto.patientName}"></td>

                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="bg-purple-500/20 text-purple-300 px-2 py-1 rounded text-xs font-bold border border-purple-500/30" th:text="${dto.exam.examType}"></span>
                        <span class="text-gray-300 ml-2" th:text="${dto.exam.areaToExamine}"></span>
                    </td>

                    <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate" th:title="${dto.exam.clinicalReason}" th:text="${dto.exam.clinicalReason}"></td>

                    <!-- 🚀 DISPLAY DOCTOR -->
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-indigo-300" th:text="${dto.doctorName}"></td>

                    <td class="px-6 py-4 whitespace-nowrap text-right">
                        <a th:href="@{/radiologist/exam/{id}(id=${dto.exam.id})}"
                           class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition shadow-md">
                            Complete Report
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pendingExams)}">
                    <td colspan="6" class="text-center py-12 text-gray-400">
                        <div class="text-4xl mb-2">🎉</div>
                        No pending orders found. Great job!
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
