<!DOCTYPE html>
<html lang="hy" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Սխալ - Avelia Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex items-center justify-center min-h-screen relative overflow-hidden">

<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-red-100 rounded-full blur-3xl"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-100 rounded-full blur-3xl"></div>

<div class="relative z-10 text-center bg-white/80 backdrop-blur-lg border border-gray-200 p-12 rounded-3xl shadow-xl max-w-xl w-full mx-4">

  <h1 class="text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 mb-4"
      th:text="${statusCode}">
    404
  </h1>

  <h2 class="text-3xl font-bold text-gray-900 mb-4 tracking-tight">Ուփս... Ինչ-որ բան այն չէ 😕</h2>

  <div class="bg-gray-100 border border-gray-200 rounded-xl p-4 mb-8">
    <p class="text-gray-600 font-medium leading-relaxed" th:text="${errorMessage}">
      Այս էջը գոյություն չունի կամ տեղափոխվել է:
    </p>
  </div>

  <div class="flex flex-col sm:flex-row gap-4 justify-center">
    <button onclick="history.back()"
            class="px-6 py-3 bg-white hover:bg-gray-50 border border-gray-300 rounded-xl text-gray-700 font-semibold shadow-sm transition-all flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Հետ վերադառնալ
    </button>

    <a th:href="@{/}"
       class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-xl font-bold hover:shadow-lg hover:shadow-blue-500/30 transition-all flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Գլխավոր Էջ
    </a>
  </div>
</div>

</body>
</html>
