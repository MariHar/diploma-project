<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{head.title.forgot_password}">Forgot Password - Avelia Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              100: '#1E293B',
              200: '#0F172A',
              300: '#020617',
            },
            accent: {
              cyan: '#06B6D4',
              blue: '#3B82F6',
              purple: '#8B5CF6',
            },
            light: {
              100: '#F9FAFB',
              200: '#F3F4F6',
              300: '#E5E7EB',
            }
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-in',
            'slide-up': 'slideUp 0.5s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shake': 'shake 0.5s ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-10px)' },
              '20%, 40%, 60%, 80%': { transform: 'translateX(10px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Light Mode Variables and Overrides */
    :root {
      --transition-theme: all 0.3s ease;
    }

    body,
    nav,
    .service-card,
    .bg-dark-100,
    .bg-dark-200,
    .bg-dark-300,
    footer {
      transition: var(--transition-theme);
    }

    body:not(.dark) {
      background-color: #F9FAFB !important;
      color: #1E293B !important;
    }

    body:not(.dark) .bg-dark-300 {
      background-color: #F9FAFB !important;
    }

    body:not(.dark) .bg-dark-200 {
      background-color: #FFFFFF !important;
      border-color: #E5E7EB !important;
    }

    body:not(.dark) .bg-dark-100 {
      background-color: #FFFFFF !important;
      border-color: #E5E7EB !important;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    }

    body:not(.dark) .text-gray-100 {
      color: #1E293B !important;
    }

    body:not(.dark) .text-gray-300 {
      color: #4B5563 !important;
    }

    body:not(.dark) .text-gray-400 {
      color: #6B7280 !important;
    }

    body:not(.dark) .text-white {
      color: #1E293B !important;
    }

    body:not(.dark) .border-gray-800 {
      border-color: #E5E7EB !important;
    }

    body:not(.dark) .border-gray-700 {
      border-color: #D1D5DB !important;
    }

    body:not(.dark) nav {
      background-color: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(12px);
    }

    body:not(.dark) .nav-link {
      color: #4B5563 !important;
    }

    body:not(.dark) .nav-link:hover {
      color: #1E293B !important;
    }

    body:not(.dark) footer {
      background-color: #FFFFFF !important;
    }

    body:not(.dark) input[type="text"], body:not(.dark) input[type="email"] {
      background-color: #F3F4F6 !important;
      border-color: #CBD5E1 !important;
      color: #1E293B !important;
    }

    body:not(.dark) input[type="text"]:focus, body:not(.dark) input[type="email"]:focus {
      border-color: #06B6D4 !important;
    }

    body:not(.dark) .dropdown-menu {
      background-color: #FFFFFF !important;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    /* Light theme background override */
    body:not(.dark) {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%) !important;
    }

    body:not(.dark) .card-bg {
      background: white !important;
      border-color: #e5e7eb !important;
    }

    body:not(.dark) .text-custom {
      color: #1f2937 !important;
    }

    body:not(.dark) .text-muted-custom {
      color: #6b7280 !important;
    }

    body:not(.dark) .input-bg {
      background: #f9fafb !important;
      border-color: #cbd5e1 !important;
      color: #1f2937 !important;
    }

    body:not(.dark) .input-bg:focus {
      border-color: #06B6D4 !important;
      background: white !important;
    }

    /* Dark theme background overrides */
    body.dark {
      background: linear-gradient(135deg, #020617 0%, #0F172A 100%) !important;
    }

    body.dark .card-bg {
      background: #1E293B !important;
      border-color: #374151 !important;
    }

    body.dark .text-custom {
      color: #f9fafb !important;
    }

    body.dark .text-muted-custom {
      color: #9ca3af !important;
    }

    body.dark .input-bg {
      background: #0F172A !important;
      border-color: #374151 !important;
      color: #f9fafb !important;
    }

    body.dark .input-bg:focus {
      border-color: #06B6D4 !important;
      background: #1E293B !important;
    }

    /* Language Switcher Overrides */
    .language-switcher { backdrop-filter: blur(10px); background: rgba(30, 41, 59, 0.8); }
    body:not(.dark) .language-switcher { background: rgba(255, 255, 255, 0.9) !important; border-color: #E5E7EB !important; }
    .lang-btn { color: #94A3B8; transition: all 0.3s ease; }
    .lang-btn:hover { color: #06B6D4; }
    .lang-btn.active { background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%); color: white; transform: scale(1.05); }
    body:not(.dark) .lang-btn { color: #64748B; }
    body:not(.dark) .lang-btn.active { color: white; }
    .theme-toggle { position: fixed; top: 2rem; right: 2rem; z-index: 50; }
  </style>
</head>
<body class="dark font-sans min-h-screen flex items-center justify-center p-4">

<!-- Background Decorative Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
  <div class="absolute -top-40 -right-40 w-80 h-80 bg-accent-cyan/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-accent-blue/10 rounded-full blur-3xl"></div>
</div>

<!-- Floating Theme Toggle -->
<button type="button" id="themeToggle" class="theme-toggle w-12 h-12 rounded-xl bg-dark-100 border border-gray-700 flex items-center justify-center hover:bg-dark-200 transition-all hover:scale-110 group shadow-md">
  <svg id="sunIcon" class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  <svg id="moonIcon" class="w-6 h-6 text-indigo-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
</button>

<!-- Floating Language Switcher -->
<div class="language-switcher fixed top-2 left-2 md:top-6 md:left-6 z-50 flex items-center gap-2 bg-dark-100 border border-gray-700 rounded-xl p-1.5 shadow-lg">
  <button onclick="changeLanguage('en')" class="lang-btn active px-3 py-2 rounded-lg text-sm font-semibold transition-all hover:bg-dark-200" data-lang="en">EN</button>
  <button onclick="changeLanguage('hy')" class="lang-btn px-3 py-2 rounded-lg text-sm font-semibold transition-all hover:bg-dark-200" data-lang="hy">AM</button>
  <button onclick="changeLanguage('ru')" class="lang-btn px-3 py-2 rounded-lg text-sm font-semibold transition-all hover:bg-dark-200" data-lang="ru">RU</button>
</div>

<div class="w-full max-w-md relative z-10 animate-slide-up my-10">
  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center gap-3 mb-4">
      <div class="w-14 h-14 bg-gradient-to-br from-accent-cyan to-accent-blue rounded-xl flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </div>
      <span class="text-2xl font-bold gradient-text" th:text="#{nav.logo.title}">avelia clinic</span>
    </div>
  </div>

  <!-- Forgot Password Card -->
  <div class="card-bg border rounded-2xl shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-accent-cyan to-accent-blue p-6 text-center">
      <div class="w-20 h-20 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse-slow">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2" th:text="#{forgot.card.title}">Forgot Password?</h2>
      <p class="text-blue-100 text-sm" th:text="#{forgot.card.subtitle}">No worries, we'll send you reset instructions</p>
    </div>

    <!-- Body -->
    <div class="p-8">
      <!-- Info Box -->
      <div class="bg-accent-cyan/10 border border-accent-cyan/20 rounded-xl p-4 mb-6">
        <div class="flex items-start gap-3">
          <svg class="w-5 h-5 text-accent-cyan flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-sm text-muted-custom" th:text="#{forgot.info_box.text}">Enter your email address and we will send you a 6-digit code to reset your password.</p>
        </div>
      </div>

      <!-- Backend Error Message -->
      <div th:if="${errorMsg}" class="mb-6 p-4 bg-red-500/10 border border-red-500/20 rounded-xl animate-shake">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-red-500 text-sm translate-me" th:text="${errorMsg}"></p>
        </div>
      </div>

      <!-- Forgot Password Form (Backend Connection) -->
      <form th:action="@{/forgot-password/submit}" method="post">
        <div class="mb-6">
          <label for="email" class="block text-sm font-medium text-custom mb-2" th:text="#{login.label.email}">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <input
                    type="email"
                    id="email"
                    name="email"
                    class="w-full pl-12 pr-4 py-3.5 input-bg border-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent-cyan transition-all"
                    th:placeholder="#{forgot.form.email.placeholder}"
                    required
                    autocomplete="email"
            />
          </div>
        </div>

        <button
                type="submit"
                class="w-full bg-gradient-to-r from-accent-cyan to-accent-blue text-white font-semibold py-4 rounded-xl hover:shadow-lg hover:shadow-accent-cyan/30 transition-all transform hover:scale-105 flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <span th:text="#{forgot.form.submit_btn}">Send Reset Code</span>
        </button>
      </form>

      <!-- Back to Login Link (Backend Connection) -->
      <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">
        <p class="text-sm text-muted-custom">
          <span th:text="#{forgot.footer.text}">Remember your password?</span>
          <a th:href="@{/login}" class="text-accent-cyan hover:text-accent-blue font-medium transition-colors inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            <span th:text="#{forgot.footer.back_to_login}">Back to Login</span>
          </a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  // TASK 4: Language Switcher Logic
  function changeLanguage(lang) {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
  }

  // Active language buttons state modifier
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const currentLang = urlParams.get('lang') || 'en';
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.getAttribute('data-lang') === currentLang) {
        btn.classList.add('active');
      }
    });

    document.getElementById('email').focus();
  });

  // Theme Toggle Functionality
  const themeToggle = document.getElementById('themeToggle');
  const sunIcon = document.getElementById('sunIcon');
  const moonIcon = document.getElementById('moonIcon');
  const html = document.documentElement;

  const currentTheme = localStorage.getItem('theme') || 'dark';
  html.classList.toggle('dark', currentTheme === 'dark');
  updateIcons(currentTheme);

  themeToggle.addEventListener('click', () => {
    const isDark = html.classList.toggle('dark');
    const theme = isDark ? 'dark' : 'light';
    localStorage.setItem('theme', theme);
    updateIcons(theme);
  });

  function updateIcons(theme) {
    if (theme === 'dark') {
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    } else {
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }
  }
</script>
</body>
</html>
