<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Վճարման Կտրոն #<span th:text="${#strings.substring(invoice.id, invoice.id.length() - 6)}"></span></title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 p-6 md:p-8">

  <!-- Լոգո և Վերնագիր -->
  <div class="text-center border-b border-dashed border-slate-300 pb-6 mb-6">
    <h1 class="text-2xl font-black text-slate-800 tracking-wide">Avelia Medical Clinic</h1>
    <p class="text-xs text-slate-400 mt-1">Բժշկական Առցանց Անդորրագիր</p>
  </div>

  <!-- Կտրոնի Տեղեկություն -->
  <div class="space-y-2 text-sm text-slate-600 mb-6 bg-slate-50 p-4 rounded-xl">
    <div class="flex justify-between">
      <span>Կտրոնի ID:</span>
      <strong class="text-slate-800" th:text="${invoice.id}"></strong>
    </div>
    <div class="flex justify-between">
      <span>Պացիենտ:</span>
      <strong class="text-slate-800" th:text="${patient.firstName + ' ' + patient.lastName}"></strong>
    </div>
    <div class="flex justify-between">
      <span>Վճարման Ամսաթիվ:</span>
      <strong class="text-slate-800" th:text="${invoice.paidDate != null ? #temporals.format(invoice.paidDate, 'dd.MM.yyyy HH:mm') : '---'}"></strong>
    </div>
    <div class="flex justify-between">
      <span>Կարգավիճակ:</span>
      <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full">✓ ՎՃԱՐՎԱԾ Է</span>
    </div>
  </div>

  <!-- Ծառայությունների Ցուցակ -->
  <div class="mb-6">
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Կատարված Ծառայություններ</h3>
    <div class="border-t border-slate-200 divide-y divide-slate-100">
      <div th:each="item : ${invoice.lineItems}" class="py-3 flex justify-between text-sm">
        <span class="text-slate-700" th:text="${item.description}"></span>
        <span class="font-semibold text-slate-900" th:text="${item.unitPrice} + ' ֏'"></span>
      </div>
    </div>
  </div>

  <!-- Ընդհանուր Հաշիվ -->
  <div class="border-t-2 border-double border-slate-300 pt-4 flex justify-between items-center mb-8">
    <span class="text-base font-bold text-slate-700">Վճարված Ընդհանուր Գումար՝</span>
    <span class="text-2xl font-black text-emerald-600" th:text="${invoice.totalAmount} + ' ֏'"></span>
  </div>

  <!-- Գործողությունների Կոճակներ -->
  <div class="flex gap-4 no-print">
    <a th:href="@{/patient/invoices}" class="w-1/2 text-center bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-4 rounded-xl transition text-sm">
      Հետ գնալ
    </a>
    <button onclick="window.print()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
      Տպել Կտրոնը
    </button>
  </div>
</div>

<!-- Որպեսզի տպելիս կոճակները չերևան -->
<style>
  @media print {
    .no-print { display: none; }
    body { background: white; padding: 0; }
    .max-w-xl { border: none; shadow: none; box-shadow: none; }
  }
</style>

</body>
</html>
