<!DOCTYPE html>
<html lang="hy" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Վճարում - Avelia Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 100: '#1E293B', 200: '#0F172A', 300: '#020617' },
                        accent: { cyan: '#06B6D4', blue: '#3B82F6', purple: '#8B5CF6' }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }

        // Auto-apply dark mode if set globally in the app
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        .gradient-text { background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-dark-300 min-h-screen flex flex-col items-center justify-center p-4 md:p-8 font-sans transition-colors duration-300 relative overflow-hidden">

<!-- Subtle Premium Background Elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[70%] md:w-[40%] h-[50%] rounded-full bg-accent-cyan/5 dark:bg-accent-cyan/10 blur-3xl"></div>
    <div class="absolute top-[60%] -right-[10%] w-[60%] md:w-[30%] h-[60%] rounded-full bg-accent-blue/5 dark:bg-accent-blue/10 blur-3xl"></div>
</div>

<!-- Branding Header -->
<div class="mb-8 text-center animate-[fadeIn_0.5s_ease-out]">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-accent-cyan to-accent-blue rounded-2xl shadow-lg shadow-accent-cyan/20 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
    </div>
    <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">Avelia Clinic</h1>
    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-widest mt-1">Secure Checkout</p>
</div>

<!-- ERROR SCENARIO (NO DRUGS IN STOCK) -->
<div th:if="${emptyStockMessage}" class="bg-white dark:bg-dark-200 p-8 rounded-3xl shadow-xl dark:shadow-[0_0_40px_rgba(0,0,0,0.3)] max-w-md w-full text-center border border-gray-100 dark:border-gray-800 relative overflow-hidden animate-[fadeIn_0.5s_ease-out]">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-red-500"></div>
    <div class="w-20 h-20 bg-red-50 dark:bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
    </div>
    <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-3">Դեղերը Առկա Չեն</h2>
    <p class="text-sm font-medium text-gray-600 dark:text-gray-400 mb-8 leading-relaxed translate-me" th:text="${emptyStockMessage}"></p>
    <a href="/profile" class="block w-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold py-3.5 rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 dark:focus:ring-offset-dark-300">
        Վերադառնալ Պրոֆիլ
    </a>
</div>

<!-- SUCCESS SCENARIO (ORDER READY FOR STRIPE) -->
<div th:if="${order != null}" class="bg-white dark:bg-dark-200 max-w-md w-full rounded-3xl shadow-xl dark:shadow-[0_0_40px_rgba(0,0,0,0.3)] overflow-hidden border border-gray-100 dark:border-gray-800 animate-[fadeIn_0.5s_ease-out]">

    <!-- Card Header -->
    <div class="bg-gradient-to-r from-accent-cyan to-accent-blue p-8 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-white/10 backdrop-blur-sm"></div>
        <div class="relative z-10">
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            </div>
            <h2 class="text-xl font-extrabold text-white tracking-wide">Դեղատան Պատվեր</h2>
            <p class="text-white/80 text-xs font-semibold mt-1.5 uppercase tracking-wider">Անվտանգ Առցանց Վճարում</p>
        </div>
    </div>

    <div class="p-6 md:p-8">
        <!-- Total Amount -->
        <div class="flex flex-col items-center justify-center mb-8 pb-8 border-b border-gray-100 dark:border-gray-800/60">
            <span class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">Ընդհանուր գումար</span>
            <div class="text-4xl font-black text-gray-900 dark:text-white flex items-baseline gap-1">
                <span class="translate-me" th:text="${order.totalAmount}"></span>
                <span class="text-2xl text-accent-cyan">֏</span>
            </div>
        </div>

        <!-- Delivery Details -->
        <div class="mb-6">
            <h4 class="text-[10px] font-extrabold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Առաքման Տվյալներ
            </h4>
            <div class="bg-gray-50 dark:bg-dark-100/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-800 text-sm text-gray-700 dark:text-gray-300">
                <p class="flex items-start gap-3 font-medium">
                    <span class="text-accent-blue mt-0.5">📍</span>
                    <span class="translate-me leading-relaxed" th:text="${order.deliveryAddress}"></span>
                </p>
                <p class="flex items-start gap-3 mt-3 font-medium">
                    <span class="text-accent-blue mt-0.5">📞</span>
                    <span class="translate-me" th:text="${order.deliveryPhone}"></span>
                </p>
            </div>
        </div>

        <!-- Purchased Drugs -->
        <div class="mb-8">
            <h4 class="text-[10px] font-extrabold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                Գնվող Դեղեր
            </h4>
            <div class="bg-gray-50 dark:bg-dark-100/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-800">
                <ul class="text-sm font-medium text-gray-700 dark:text-gray-300 space-y-2">
                    <li th:each="drug : ${order.purchasedDrugs}" class="flex items-start gap-2">
                        <span class="text-accent-cyan mt-0.5">•</span>
                        <span class="translate-me" th:text="${drug}"></span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- FORM TO TRIGGER STRIPE -->
        <form th:action="@{/pharmacy/pay-stripe/{id}(id=${order.id})}" method="post">
            <button type="submit" class="w-full bg-gradient-to-r from-accent-cyan to-accent-blue text-white font-bold py-4 rounded-xl shadow-lg shadow-accent-cyan/30 hover:shadow-xl hover:shadow-accent-cyan/40 transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-cyan dark:focus:ring-offset-dark-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                Անցնել Վճարմանը (Stripe)
            </button>
            <p class="text-center text-[10px] text-gray-400 dark:text-gray-500 font-medium mt-4 flex items-center justify-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                Secured by Stripe
            </p>
        </form>
    </div>
</div>

</body>
</html>
