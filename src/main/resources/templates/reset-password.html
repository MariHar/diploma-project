<!DOCTYPE html>
<html lang="en" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{head.title.reset_password}">Reset Password - Avelia Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 100: '#1E293B', 200: '#0F172A', 300: '#020617' },
            accent: { cyan: '#06B6D4', blue: '#3B82F6', purple: '#8B5CF6' },
            light: { 100: '#F9FAFB', 200: '#F3F4F6', 300: '#E5E7EB' }
          },
          fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    .gradient-text { background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-bg { background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%); }
    body:not(.dark) { background-color: #F9FAFB; color: #1F2937; }
    body.dark { background-color: #020617; color: #F9FAFB; }
    .card-bg { background-color: #0F172A; border-color: #1E293B; }
    body:not(.dark) .card-bg { background-color: #FFFFFF; border-color: #E5E7EB; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05); }
    .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s ease; width: 0; }
    .strength-weak { width: 33%; background-color: #EF4444; }
    .strength-medium { width: 66%; background-color: #F59E0B; }
    .strength-strong { width: 100%; background-color: #10B981; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    .animate-fade-in { animation: fadeIn 0.6s ease-out; }
    .animate-shake { animation: shake 0.5s ease-in-out; }

    .code-input { width: 3rem; height: 3.5rem; font-size: 1.5rem; text-align: center; font-weight: 600; border: 2px solid #475569; border-radius: 0.75rem; background: transparent; color: inherit; transition: all 0.3s ease; }
    body:not(.dark) .code-input { border-color: #CBD5E1; }
    .code-input:focus { border-color: #06B6D4; outline: none; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2); }

    .particle { position: absolute; width: 4px; height: 4px; background: #06B6D4; border-radius: 50%; opacity: 0.3; animation: float 20s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-100px); } }

    /* Language Switcher Styles */
    .language-switcher { backdrop-filter: blur(10px); background: rgba(30, 41, 59, 0.8); }
    body:not(.dark) .language-switcher { background: rgba(255, 255, 255, 0.9) !important; border-color: #E5E7EB !important; }
    .lang-btn { color: #94A3B8; transition: all 0.3s ease; }
    .lang-btn:hover { color: #06B6D4; }
    .lang-btn.active { background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%); color: white; transform: scale(1.05); }
    body:not(.dark) .lang-btn { color: #64748B; }
    body:not(.dark) .lang-btn.active { color: white; }
    .theme-toggle { position: fixed; top: 2rem; right: 2rem; z-index: 50; }
  </style>
</head>
<body class="dark min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

<div class="fixed inset-0 pointer-events-none" id="particles"></div>

<!-- Floating Theme Toggle -->
<button type="button" id="themeToggle" class="theme-toggle w-12 h-12 rounded-xl bg-dark-100 border border-gray-700 flex items-center justify-center hover:bg-dark-200 transition-all hover:scale-110 group shadow-md">
  <svg id="sunIcon" class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  <svg id="moonIcon" class="w-6 h-6 text-indigo-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
</button>

<!-- Floating Language Switcher -->
<div class="language-switcher fixed top-2 left-2 md:top-6 md:left-6 z-50 flex items-center gap-2 bg-dark-100 border border-gray-700 rounded-xl p-1.5 shadow-lg">
  <button onclick="changeLanguage('en')" class="lang-btn active px-3 py-2 rounded-lg text-sm font-semibold transition-all hover:bg-dark-200" data-lang="en">EN</button>
  <button onclick="changeLanguage('hy')" class="lang-btn px-3 py-2 rounded-lg text-sm font-semibold transition-all hover:bg-dark-200" data-lang="hy">AM</button>
  <button onclick="changeLanguage('ru')" class="lang-btn px-3 py-2 rounded-lg text-sm font-semibold transition-all hover:bg-dark-200" data-lang="ru">RU</button>
</div>

<div class="relative z-10 w-full max-w-md animate-fade-in my-10">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="flex justify-center mb-4">
      <div class="w-16 h-16 bg-gradient-to-br from-accent-cyan to-accent-blue rounded-2xl flex items-center justify-center shadow-lg">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
    </div>
    <h1 class="text-3xl font-bold mb-2">
      <span th:text="#{reset.title.reset}">Reset</span> <span class="gradient-text" th:text="#{reset.title.password}">Password</span>
    </h1>
    <p class="text-gray-400" th:text="#{reset.subtitle}">Secure your account with a new password</p>
  </div>

  <div class="card-bg border rounded-2xl shadow-2xl overflow-hidden">
    <!-- User Info -->
    <div class="bg-accent-cyan/10 border-b border-gray-700/50 p-4 flex items-center gap-3">
      <div class="w-10 h-10 bg-accent-cyan/20 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-accent-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <div>
        <p class="text-xs text-gray-400" th:text="#{reset.user_info.prefix}">Reset code sent to</p>
        <p class="font-semibold translate-me" th:text="${email}">user@example.com</p>
      </div>
    </div>

    <div class="p-8">
      <!-- Backend Error Alert -->
      <div th:if="${errorMsg}" class="mb-6 bg-red-500/10 border border-red-500/50 rounded-lg p-4 animate-shake">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <p class="text-red-500 text-sm font-medium translate-me" th:text="${errorMsg}"></p>
        </div>
      </div>

      <!-- Form -->
      <form th:action="@{/reset-password/submit}" method="post" id="resetForm" class="space-y-6">
        <!-- Hidden fields for backend -->
        <input type="hidden" name="email" th:value="${email}" />
        <input type="hidden" name="code" id="hiddenCode" />

        <!-- Code Inputs -->
        <div>
          <label class="block text-sm font-semibold mb-3 opacity-70" th:text="#{reset.form.code.label}">6-Digit Reset Code</label>
          <div class="flex gap-2 justify-between">
            <input type="text" maxlength="1" class="code-input" data-index="0" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" maxlength="1" class="code-input" data-index="1" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" maxlength="1" class="code-input" data-index="2" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" maxlength="1" class="code-input" data-index="3" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" maxlength="1" class="code-input" data-index="4" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" maxlength="1" class="code-input" data-index="5" inputmode="numeric" pattern="[0-9]" required>
          </div>
        </div>

        <!-- New Password -->
        <div>
          <label class="block text-sm font-semibold mb-2 opacity-70" th:text="#{reset.form.password.label}">New Password</label>
          <input type="password" name="newPassword" id="newPassword"
                 class="w-full bg-black/20 dark:bg-black/20 border border-gray-700 dark:border-gray-700 rounded-xl px-4 py-3 focus:border-accent-cyan outline-none transition-all text-gray-900 dark:text-white"
                 th:placeholder="#{reset.form.password.placeholder}" required minlength="6">

          <div class="mt-3">
            <div class="h-1.5 bg-gray-700 rounded-full overflow-hidden">
              <div id="strengthBar" class="strength-bar"></div>
            </div>
            <p id="strengthText" class="text-[10px] mt-1 uppercase tracking-wider opacity-50"></p>
          </div>
        </div>

        <button type="submit" class="w-full gradient-bg text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-accent-cyan/30 transition-all transform hover:scale-[1.02] active:scale-[0.98]" th:text="#{reset.form.submit_btn}">
          Update Password
        </button>
      </form>

      <div class="text-center mt-6">
        <a th:href="@{/login}" class="text-sm opacity-60 hover:text-accent-cyan transition-colors flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span th:text="#{reset.form.back_to_login}">Back to Login</span>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  // TASK 4: Language Switcher
  function changeLanguage(lang) {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
  }

  // Language buttons state setup
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const currentLang = urlParams.get('lang') || 'en';
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.getAttribute('data-lang') === currentLang) {
        btn.classList.add('active');
      }
    });
  });

  // Code input navigation handlers
  const codeInputs = document.querySelectorAll('.code-input');
  const hiddenCode = document.getElementById('hiddenCode');
  const form = document.getElementById('resetForm');
  const passwordInput = document.getElementById('newPassword');
  const strengthBar = document.getElementById('strengthBar');
  const strengthText = document.getElementById('strengthText');

  codeInputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      if (e.target.value && index < 5) codeInputs[index + 1].focus();
      combineCode();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && index > 0) codeInputs[index - 1].focus();
    });
  });

  function combineCode() {
    let code = "";
    codeInputs.forEach(input => code += input.value);
    hiddenCode.value = code;
  }

  // Password Strength calculations
  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    let strength = 0;
    if (val.length >= 6) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;

    strengthBar.className = 'strength-bar';
    if (strength === 0) { strengthText.textContent = ''; }
    else if (strength <= 2) { strengthBar.classList.add('strength-weak'); strengthText.textContent = 'Weak'; }
    else if (strength === 3) { strengthBar.classList.add('strength-medium'); strengthText.textContent = 'Medium'; }
    else { strengthBar.classList.add('strength-strong'); strengthText.textContent = 'Strong'; }
  });

  // Soft Theme Switcher integration
  const themeToggle = document.getElementById('themeToggle');
  const sunIcon = document.getElementById('sunIcon');
  const moonIcon = document.getElementById('moonIcon');
  const html = document.documentElement;
  const body = document.body;

  function applyTheme(theme) {
    if (theme === 'dark') {
      body.classList.add('dark');
      html.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    } else {
      body.classList.remove('dark');
      html.classList.remove('dark');
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }
  }

  applyTheme(localStorage.getItem('theme') || 'dark');

  themeToggle.addEventListener('click', () => {
    const newTheme = body.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });

  // Particle background generation
  const container = document.getElementById('particles');
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(p);
  }
</script>
</body>
</html>
