<!DOCTYPE html>
<html lang="hy" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Վաճառքների Պատմություն</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto mb-8 flex justify-between items-center">
    <div>
        <a th:href="@{/pharmacy-admin/dashboard}" class="text-blue-500 hover:text-blue-700 flex items-center gap-2 mb-2 font-semibold transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Վերադառնալ Պահեստ
        </a>
        <h1 class="text-3xl font-bold text-slate-800">📊 Վաճառքների Պատմություն</h1>
    </div>
<!--    <div class="flex gap-3">-->
<!--        <button class="bg-green-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-green-700 shadow-lg flex items-center gap-2 transition">-->
<!--            <i data-lucide="shopping-cart" class="w-5 h-5"></i> Նոր Վաճառք-->
<!--        </button>-->
<!--    </div>-->
</div>

<div class="max-w-7xl mx-auto">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-green-500">
            <p class="text-slate-500 text-sm font-semibold uppercase tracking-wide">Այսօրվա Եկամուտ</p>
            <h3 class="text-3xl font-bold text-green-600 mt-1" th:text="${todayRevenue + ' ֏'}">0 ֏</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-blue-500">
            <p class="text-slate-500 text-sm font-semibold uppercase tracking-wide">Ընդհանուր Եկամուտ</p>
            <h3 class="text-3xl font-bold text-blue-600 mt-1" th:text="${totalRevenue + ' ֏'}">0 ֏</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-purple-500">
            <p class="text-slate-500 text-sm font-semibold uppercase tracking-wide">Անդորրագրերի Քանակ</p>
            <h3 class="text-3xl font-bold text-purple-600 mt-1" th:text="${totalSalesCount}">0</h3>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b">
                <tr>
                    <th class="p-4 font-semibold text-slate-600 text-sm">Անդորրագիր ID</th>
                    <th class="p-4 font-semibold text-slate-600 text-sm">Ամսաթիվ / Ժամ</th>
                    <th class="p-4 font-semibold text-slate-600 text-sm">Պացիենտ</th>
                    <th class="p-4 font-semibold text-slate-600 text-sm">Բժիշկ / Բաժանմունք</th>
                    <th class="p-4 font-semibold text-slate-600 text-sm">Վաճառված Դեղեր</th>
                    <th class="p-4 font-semibold text-slate-600 text-sm text-right">Ընդհանուր Գումար</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sale : ${sales}" class="border-b hover:bg-slate-50 transition">

                    <td class="p-4 font-mono text-xs text-slate-500 uppercase"
                        th:text="${sale.id != null && sale.id.length() > 8 ? #strings.substring(sale.id, sale.id.length() - 8) : sale.id}">
                        ID
                    </td>

                    <td class="p-4 text-sm font-semibold text-slate-700"
                        th:text="${sale.saleDate != null ? #temporals.format(sale.saleDate, 'dd.MM.yyyy HH:mm') : '-'}">
                        Ամսաթիվ
                    </td>

                    <td class="p-4">
                        <div class="font-bold text-slate-800 text-sm"
                             th:text="${sale.patientName != null ? sale.patientName : 'Անհայտ Պացիենտ'}">
                            Անուն
                        </div>
                    </td>

                    <td class="p-4">
                        <div class="font-bold text-slate-700 text-sm"
                             th:text="${sale.doctorName != null ? sale.doctorName : (sale.prescribingDoctor != null ? sale.prescribingDoctor : '-')}">
                            Բժիշկ
                        </div>
                        <div class="text-xs text-slate-500"
                             th:text="${sale.department != null ? sale.department : (sale.doctorSpecialization != null ? sale.doctorSpecialization : '-')}">
                            Բաժանմունք
                        </div>
                    </td>

                    <td class="p-4">
                        <ul class="text-sm text-slate-600 list-disc list-inside">
                            <li th:each="item : ${sale.items}">
                                <span class="font-bold text-slate-800" th:text="${item.medicineName}">Դեղ</span>
                                <span class="text-slate-500" th:text="' (' + ${item.quantity} + ' հատ x ' + ${item.priceAtSale} + ' ֏)'"></span>
                            </li>
                        </ul>
                    </td>
                    <td class="p-4 text-right font-bold text-lg text-slate-800" th:text="${sale.totalAmount + ' ֏'}">0 ֏</td>
                </tr>
                <tr th:if="${sales.empty}">
                    <td colspan="6" class="p-10 text-center text-slate-400 italic">Դեռևս վաճառքներ չեն գրանցվել:</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
