name: Clean comments nightly

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for an open agent pull request
        id: openpr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh pr list --head agent/clean-comments --state open --json number --jq length)
          echo count=$COUNT >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.openpr.outputs.count == '0'
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        if: steps.openpr.outputs.count == '0'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        if: steps.openpr.outputs.count == '0'
        run: pip install openai

      - name: Run the agent
        if: steps.openpr.outputs.count == '0'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BATCH_SIZE: '3'
        run: python tools/clean_comments.py

      - name: Check that the project still compiles
        if: steps.openpr.outputs.count == '0'
        run: mvn -B -q compile

      - name: Open pull request
        if: steps.openpr.outputs.count == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: agent/clean-comments
          base: main
          add-paths: |
            src
            .agent/progress.json
          commit-message: Agent comment cleanup
          title: Nightly comment cleanup
          body-path: AGENT_REPORT.md
          delete-branch: true
